[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthrisk-ai"
version = "0.1.0"
description = "Local geospatial insurance-risk pipeline for Greater Phoenix."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "earthengine-api>=0.1.414",
  "geemap>=0.33.0",
  "geopandas>=0.14.4",
  "h3>=3.7.7",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "pyarrow>=15.0.2",
  "pyproj>=3.6.1",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
  "rasterio>=1.3.10",
  "rioxarray>=0.15.5",
  "scikit-learn>=1.4.2",
  "shapely>=2.0.4",
  "streamlit>=1.34.0",
  "xarray>=2024.3.0",
  "xgboost>=2.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.1",
]

[project.scripts]
earthrisk = "src.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
